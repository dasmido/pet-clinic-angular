<button
	type="button"
	class="theme-toggle"
	[attr.aria-label]="themeService.isLightMode() ? 'Switch to dark mode' : 'Switch to light mode'"
	(click)="themeService.toggleTheme()"
>
	<span class="theme-toggle__icon">{{ themeService.isLightMode() ? '🌙' : '☀️' }}</span>
	<!--<span class="theme-toggle__label">{{ themeService.isLightMode() ? 'Dark mode' : 'Light mode' }}</span>-->
</button>
<router-outlet></router-outlet>
